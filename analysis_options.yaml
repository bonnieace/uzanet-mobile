include: package:flutter_lints/flutter.yaml

analyzer:
  # These files are the pre-API direct-RouterOS mobile client. They remain in the
  # repository only as a compatibility/reference layer while functionality is
  # migrated to lib/api and lib/screens. New production code stays fully linted.
  exclude:
    - lib/active.dart
    - lib/documents.dart
    - lib/homepage.dart
    - lib/hotspot.dart
    - lib/internet_plan_status.dart
    - lib/tickets.dart
    - lib/users.dart
    - lib/voucher.dart
    - build/**

linter:
  rules:
    avoid_print: true
