plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def signingProperties = new Properties()
def signingFile = rootProject.file('key.properties')
if (signingFile.exists()) {
    signingFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace = "com.example.uzanet"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.uzanet"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                keyAlias = signingProperties['keyAlias']
                keyPassword = signingProperties['keyPassword']
                storeFile = file(signingProperties['storeFile'])
                storePassword = signingProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

// Unsigned artifacts are allowed for CI compilation, never debug-signed as releases.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains('release') } &&
        !signingFile.exists() && !project.hasProperty('allowUnsignedRelease')) {
        throw new GradleException('Release signing is required. Configure android/key.properties; CI may pass -PallowUnsignedRelease=true for unsigned verification only.')
    }
}

flutter {
    source = "../.."
}
